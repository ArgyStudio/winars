        <script>
            window.addEventListener('load', () => {
                const track = document.getElementById('track');
                const imagePaths = [];
                const folderRoute = "./assets/images/landing/carrousel";
                const totalImages = 15;

                for (let i = 1; i <= totalImages; i++) {
                    const path = `${folderRoute}/slide ${i}.webp`;
                    imagePaths.push(path);
                }

                imagePaths.forEach(src => {
                    const li = document.createElement('li');
                    li.className = 'carousel-item';
                    const img = document.createElement('img');
                    img.src = src;
                    img.loading = 'lazy';
                    li.appendChild(img);
                    track.appendChild(li);
                });

                console.log('Elementos generados en el track:', track.children.length);
            });
        </script>

        <script>
            window.addEventListener('DOMContentLoaded', () => {
                const track = document.getElementById('track');
                const carousel = document.querySelector('.carousel');
                const slides = Array.from(track.children);

                if (slides.length === 0) {
                    console.error('No hay elementos en el track.');
                    return; // Detenemos la ejecución si no hay slides
                }

                const slideWidth = slides[0].getBoundingClientRect().width;
                const trackGap = parseFloat(getComputedStyle(track).gap);

                const visibleCount = Math.ceil(
                    carousel.clientWidth / (slideWidth + trackGap)
                ) + 1;

                for (let i = 0; i < visibleCount; i++) {
                    const clone = slides[i % slides.length].cloneNode(true);
                    track.appendChild(clone);
                }

                const originalWidth = slides.length * (slideWidth + trackGap);
                track.style.setProperty('--scroll-end', `-${originalWidth}px`);
                track.style.setProperty('--duration', `${slides.length * 2}s`);
                track.style.animation = `scrollCarousel var(--duration) linear infinite`;
            });
        </script>
